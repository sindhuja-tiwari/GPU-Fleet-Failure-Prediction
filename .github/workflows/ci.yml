name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke test the CLI
        run: |
          gpufleet simulate --nodes 4 --days 3 --out data/smoke
          gpufleet summarize data/smoke
          gpufleet plots data/smoke --out data/smoke/figures
