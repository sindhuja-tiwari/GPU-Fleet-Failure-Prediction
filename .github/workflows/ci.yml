name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke test the CLI
        run: |
          gpufleet simulate --nodes 4 --days 3 --out data/smoke
          gpufleet summarize data/smoke
          gpufleet plots data/smoke --out data/smoke/figures
          gpufleet features data/smoke
          gpufleet stragglers data/smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start the API with the shipped bundle
        run: |
          docker compose up -d api
          for i in $(seq 60); do curl -sf localhost:8000/healthz && break; sleep 2; done
      - name: Replay a short fleet and check the scores
        run: |
          docker compose run --rm replayer sh -c \
            "gpufleet simulate --out /data/ci --nodes 2 --days 1.2 --seed 3 && gpufleet replay /data/ci --url http://api:8000"
          curl -sf localhost:8000/v1/summary | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(d['counters']); assert d['counters']['gpus_tracked'] >= 16"
          curl -sf localhost:8000/metrics | grep -c gpufleet_failure_probability
      - if: always()
        run: docker compose logs --tail 50 && docker compose down -v
